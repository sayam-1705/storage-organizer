[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-organizer"
version = "1.0.1"
description = "Offline, cross-platform organizer for files on local and removable storage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Storage Organizer contributors"}]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
media = ["Pillow>=10.0", "pypdf>=4.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
packaging = ["PyInstaller>=6.22,<7"]
all = ["PySide6>=6.6", "Pillow>=10.0", "pypdf>=4.0"]

[project.scripts]
storage-organizer = "storage_organizer.cli:main"
storage-organizer-gui = "storage_organizer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["storage_organizer"]
branch = true
# GUI startup is smoke-tested in CI; line-level GUI behavior is a separate UI-test concern.
omit = ["src/storage_organizer/gui.py", "src/storage_organizer/__main__.py"]
