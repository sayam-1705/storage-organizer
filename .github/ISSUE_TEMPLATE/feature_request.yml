name: Feature request
description: Suggest an improvement to Storage Organizer.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem or workflow the feature would improve. Keep Storage Organizer's offline-first and copy-only design in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: compatibility
    attributes:
      label: Design considerations
      options:
        - label: I have considered the offline-first and copy-only requirements.
          required: false
